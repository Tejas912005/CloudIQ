services:
  - type: web
    name: cloudiq-backend
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: "llama3-8b-8192"
      - key: CORS_ORIGINS
        # IMPORTANT: Replace with your actual Vercel deployment URL before deploying
        value: "https://cloudiq.vercel.app"

